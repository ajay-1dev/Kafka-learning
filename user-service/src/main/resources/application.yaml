spring:
  application:
    name: user-service
  datasource:
    url: ${url}
    username: ${username:}
    password: ${password:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    format-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 9002